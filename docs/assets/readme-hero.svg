<!-- README hero. CSS animation only, so GitHub plays it inline; prefers-reduced-motion shows the final frame. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="t d">
<title id="t">gellee carries a project's status from one Claude Code session to the next</title>
<desc id="d">On a laptop, a session runs /handoff and rewrites the status file of studio/loom: where work stopped and the next action. The file is pushed to a private state repository in git. On a desktop, the next session pulls it and opens with: gellee: studio/loom is active. Next: Thread the heddle frame into the loom core.</desc>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
@keyframes type{0%,4%{transform:translateX(0)}14%,100%{transform:translateX(80px)}}
.type{transform:translateX(80px);animation:type 12s steps(8,end) infinite}
@keyframes card{0%,38%{opacity:0;transform:translate(240px,144px)}40%{opacity:1;transform:translate(240px,144px)}48%,55%{opacity:1;transform:translate(418px,144px)}64%{opacity:1;transform:translate(640px,144px)}67%,100%{opacity:0;transform:translate(640px,144px)}}
.card{opacity:0;transform:translate(640px,144px);animation:card 12s ease-in-out infinite}
@keyframes a1{0%,2%{opacity:0}3.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a2{0%,16%{opacity:0}17.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a3{0%,20%{opacity:0}21.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a4{0%,23%{opacity:0}24.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a5{0%,25%{opacity:0}26.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a6{0%,28%{opacity:0}29.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a7{0%,31%{opacity:0}32.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a8{0%,33%{opacity:0}34.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a9{0%,0%{opacity:0}1.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a10{0%,50%{opacity:0}51.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a11{0%,0%{opacity:0}1.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a12{0%,40%{opacity:0}41.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a13{0%,57%{opacity:0}58.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a14{0%,53%{opacity:0}54.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a15{0%,66%{opacity:0}67.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a16{0%,69%{opacity:0}70.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a17{0%,71%{opacity:0}72.5%,95%{opacity:1}100%{opacity:0}}
@keyframes a18{0%,75%{opacity:0}76.5%,95%{opacity:1}100%{opacity:0}}
.a1{animation:a1 12s linear infinite}
.a2{animation:a2 12s linear infinite}
.a3{animation:a3 12s linear infinite}
.a4{animation:a4 12s linear infinite}
.a5{animation:a5 12s linear infinite}
.a6{animation:a6 12s linear infinite}
.a7{animation:a7 12s linear infinite}
.a8{animation:a8 12s linear infinite}
.a9{animation:a9 12s linear infinite}
.a10{animation:a10 12s linear infinite}
.a11{animation:a11 12s linear infinite}
.a12{animation:a12 12s linear infinite}
.a13{animation:a13 12s linear infinite}
.a14{animation:a14 12s linear infinite}
.a15{animation:a15 12s linear infinite}
.a16{animation:a16 12s linear infinite}
.a17{animation:a17 12s linear infinite}
.a18{animation:a18 12s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="10" y="10" width="300" height="290" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M10 40H310" stroke="#30363d"/>
<circle cx="28" cy="25" r="5" fill="#ff5f57"/>
<circle cx="44" cy="25" r="5" fill="#febc2e"/>
<circle cx="60" cy="25" r="5" fill="#28c840"/>
<text x="160" y="29" class="mono" fill="#9198a1" font-size="12" text-anchor="middle">laptop: ~/studio/loom</text>
<text x="28" y="66" class="mono a1" fill="#58a6ff" font-size="12.5">&gt; /handoff</text>
<rect class="type" x="40" y="54" width="80" height="16" fill="#0d1117"/>
<text x="28" y="92" class="mono a2" fill="#3fb950" font-size="12.5">● Rewrote studio/loom.md</text>
<text x="28" y="122" class="mono a3" fill="#58a6ff" font-size="12.5">## Where I stopped</text>
<text x="28" y="142" class="mono a4" fill="#e6edf3" font-size="12.5">The heddle frame drives the</text>
<text x="28" y="160" class="mono a5" fill="#e6edf3" font-size="12.5">warp in the simulator.</text>
<text x="28" y="188" class="mono a6" fill="#58a6ff" font-size="12.5">## Next action</text>
<text x="28" y="208" class="mono a7" fill="#e6edf3" font-size="12.5">Thread the heddle frame into</text>
<text x="28" y="226" class="mono a8" fill="#e6edf3" font-size="12.5">the loom core.</text>
<g class="a9">
<rect x="345" y="95" width="210" height="120" rx="10" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-dasharray="5 4"/>
<text x="450" y="122" class="sans" fill="#8b949e" font-size="14" text-anchor="middle" font-weight="600">state repository</text>
<text x="450" y="140" class="sans" fill="#8b949e" font-size="12" text-anchor="middle">private, in git</text>
</g>
<text x="450" y="176" class="mono a10" fill="#8b949e" font-size="11.5" text-anchor="middle">3f2a9c1 chore(studio/loom):</text>
<text x="450" y="193" class="mono a10" fill="#8b949e" font-size="11.5" text-anchor="middle">handoff</text>
<g class="a11" stroke="#8b949e" stroke-width="1.5" fill="none">
<path d="M312 155H341M335 150L341 155L335 160"/>
<path d="M557 155H586M580 150L586 155L580 160"/>
</g>
<text x="326" y="146" class="sans a12" fill="#8b949e" font-size="11" text-anchor="middle">push</text>
<text x="572" y="146" class="sans a13" fill="#8b949e" font-size="11" text-anchor="middle">pull</text>
<rect x="590" y="10" width="300" height="290" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M590 40H890" stroke="#30363d"/>
<circle cx="608" cy="25" r="5" fill="#ff5f57"/>
<circle cx="624" cy="25" r="5" fill="#febc2e"/>
<circle cx="640" cy="25" r="5" fill="#28c840"/>
<text x="740" y="29" class="mono" fill="#9198a1" font-size="12" text-anchor="middle">desktop: ~/studio/loom</text>
<text x="608" y="66" class="mono a14" fill="#58a6ff" font-size="12.5">$ claude</text>
<text x="608" y="96" class="mono a15" fill="#3fb950" font-size="12.5">gellee: studio/loom is active.</text>
<text x="608" y="116" class="mono a16" fill="#e6edf3" font-size="12.5">Next: Thread the heddle frame</text>
<text x="608" y="134" class="mono a17" fill="#e6edf3" font-size="12.5">into the loom core.</text>
<text x="608" y="166" class="mono a18" fill="#58a6ff" font-size="12.5">&gt;</text>
<rect class="a18" x="622" y="155" width="8" height="15" fill="#e6edf3"></rect>
<g class="card"><rect x="0" y="0" width="64" height="22" rx="4" fill="#1f6feb"/>
<text x="32" y="15" class="mono" fill="#ffffff" font-size="11" text-anchor="middle">loom.md</text>
</g>
<text x="450" y="336" class="sans" fill="#8b949e" font-size="14" text-anchor="middle">End a session on one machine. The next one, anywhere, starts where it stopped.</text>
</svg>
