name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste status files, session transcripts or paths from a
        real installation. Describe the problem with invented names, or
        a minimal example.
  - type: input
    id: version
    attributes:
      label: Version
      description: A release tag or a commit hash.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
