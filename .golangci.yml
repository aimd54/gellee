version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - unconvert
    - whitespace
  settings:
    errcheck:
      # Human-facing terminal output; a failed write to stdout or stderr
      # is not actionable for a command line tool.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    rules:
      # Tests run git and write fixed temporary paths.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aimd54/gellee
