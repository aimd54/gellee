[tools]
"aqua:rhysd/actionlint" = "1.7.12"
bats = "1.14.0"
go = "1.27.4"
node = "26.12.1"
"npm:markdownlint-cli2" = "0.24.0"
shellcheck = "0.11.0"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:gitleaks/gitleaks" = "8.28.0"
"aqua:zizmorcore/zizmor" = "1.33.1"

[env]
# Commit dates carry +0000, which the publication gate checks.
TZ = "UTC"
